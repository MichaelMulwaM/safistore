<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafiStore</title>
    <style>
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            margin: 0;
        }

        .login-card {
            display: flex;
            background: #fff;
            width: 750px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .login-img {
            flex: 1;
            background: #faf3e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .login-form {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form h2 {
            margin-bottom: 5px;
        }

        .login-form p {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .login-form label {
            font-size: 12px;
            color: #333;
            margin-top: 10px;
            display: block;
        }

        .login-form input[type="email"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-img">
            <img src="images/login.jpg" alt="Login Image">
        </div>

        <div class="login-form">
            <h2>Login to your account</h2>
            <p>Don't have an account? <a href="#">Sign up</a></p>

            <form>
                <label>Email</label>
                <input type="email" required>

                <label>Password</label>
                <input type="password" required>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember">
                    <label for="remember" style="margin:0;">Remember me</label>
                </div>

                <button type="submit" class="login-btn">Login</button> <br><br>
                <a href="index.html" style="font-size: 1em; padding-top: 1000px;">Back</a>
            </form>
        </div>
    </div>

</body>

</html>
